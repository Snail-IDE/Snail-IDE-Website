<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- TurtleMod Branding -->
    <meta name="title" content="TurtleMod - Home" />
    <meta name="description" content="A friendly visual coding platform built for creativity, learning, and community." />
    <meta property="theme-color" content="#00A86B" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://turtlemod.github.io/TurtleMod-Website">
    <meta property="og:title" content="TurtleMod - Home" />
    <meta property="og:image" content="/favicon.png">

    <!-- Twitter -->
    <meta property="twitter:url" content="https://turtlemod.github.io/TurtleMod-Website">
    <meta property="twitter:title" content="TurtleMod - Home">
    <meta property="twitter:description" content="A friendly visual coding platform built for creativity, learning, and community.">
    <meta property="twitter:image" content="/favicon.png">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" />

    <meta name="viewport" content="width=device-width" />
    %sveltekit.head%
    <style>
      .guidelines-warning-box {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid rgb(255, 153, 0);
        background: rgb(255, 217, 0, 0.5);
        color: black;
      }
      body.dark-mode .guidelines-warning-box {
        color: white;
        background: rgb(255, 217, 0, 0.2);
      }
    </style>
  </head>

  <body data-sveltekit-preload-data="hover" id="PAGE_BODY">
    <script defer>
      if (location.pathname.replace(/\//gmi, "").startsWith("embed")) {
        if (location.hash.replace(/#/gmi, "").startsWith("dark=")) {
          const body = document.getElementById("PAGE_BODY");
          const loop = () => {
            const darkmode = location.hash.replace(/#/gmi, "") === "dark=true";
            if (darkmode) {
              body.classList.add("dark-mode");
              body.style.background = "#111";
              return;
            }
            body.classList.remove("dark-mode");
            body.style.background = "";
          }
          setInterval(loop, 100);
          loop();
        }
      } else {
        const body = document.getElementById("PAGE_BODY");
        const loop = () => {
          const darkmode = localStorage.getItem("darkmode");
          if (darkmode) {
            body.classList.add("dark-mode");
            body.style.background = "#111";
            return;
          }
          body.classList.remove("dark-mode");
          body.style.background = "";
        }
        setInterval(loop, 100);
        loop();

        const urlParams = new URLSearchParams(location.search);
        const isLauncher = String(urlParams.get('using_launcher')) === 'true';
        window._isPenguinModLauncher = false;
        if (isLauncher) {
          body.classList.add("launcher-mode");
          window._isPenguinModLauncher = true;
        }
      }

      console.log(
        "%cSCAM ALERT! %cDo NOT paste things into here that other people sent you!",
        "color:red;font-family:system-ui;font-size:2rem;-webkit-text-stroke: 1px black;font-weight:bold",
        "color:white;font-family:system-ui;font-size:1.75rem;-webkit-text-stroke: 1px black;font-weight:bold"
      );
      console.log("If you don't know what this window does, EXIT NOW!");
    </script>

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
